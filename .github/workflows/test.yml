name: test

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    # Temporary repositories must not outlive tests through detached Git maintenance.
    env:
      GIT_CONFIG_COUNT: '1'
      GIT_CONFIG_KEY_0: maintenance.auto
      GIT_CONFIG_VALUE_0: 'false'
    strategy:
      fail-fast: false
      matrix:
        python-version: ['3.10', '3.13']
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - run: python3 scripts/build_runtime.py --check
      - run: python3 -m unittest discover -s tests -v
      - run: python3 scripts/validate_release.py --source .
      - run: git diff --check
